name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find server.js src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chat-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    env:
      BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
      FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}

    steps:
      - name: Trigger backend deployment
        run: |
          if [ -n "$BACKEND_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$BACKEND_DEPLOY_HOOK"
          else
            echo "Skipping backend deploy: BACKEND_DEPLOY_HOOK is not configured."
          fi

      - name: Trigger frontend deployment
        run: |
          if [ -n "$FRONTEND_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK"
          else
            echo "Skipping frontend deploy: FRONTEND_DEPLOY_HOOK is not configured."
          fi
