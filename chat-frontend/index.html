<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1d24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="description" content="SecureTalk is a modern, end-to-end encrypted chat application for private and resilient communication." />
    <meta name="keywords" content="secure chat, encrypted messaging, E2EE chat, local-first chat, offline messaging, secure app" />
    <meta name="author" content="SecureTalk" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://securetalk.app/" />
    <meta property="og:title" content="SecureTalk - Secure, End-to-End Encrypted Chat" />
    <meta property="og:description" content="A feature-rich, local-first chat application offering unparalleled privacy with End-to-End Encryption." />
    <meta property="og:image" content="/icon-512x512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://securetalk.app/" />
    <meta property="twitter:title" content="SecureTalk - Secure, End-to-End Encrypted Chat" />
    <meta property="twitter:description" content="A feature-rich, local-first chat application offering unparalleled privacy with End-to-End Encryption." />
    <meta property="twitter:image" content="/icon-512x512.png" />

    <title>SecureTalk - Secure, End-to-End Encrypted Chat</title>
    <script>
      // Set theme before React loads to prevent flash
      (function() {
        const saved = localStorage.getItem('theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
